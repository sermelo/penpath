name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    name: Full suite (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --extra vpype

      - name: Install dev dependencies
        run: uv pip install pytest pytest-cov

      - name: Measure one photo conversion
        run: |
          /usr/bin/time -f 'penpath convert wall time: %e s' \
            uv run penpath convert tests/fixtures/images/reference/photo.jpg \
              -o /tmp/nightly-photo.svg --pfm-setting seed=42 --quiet

      - name: Run full suite
        run: uv run pytest tests/unit tests/integration -vs
