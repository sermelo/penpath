name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for trusted publishing
  contents: read

jobs:
  publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Build wheel and sdist
        run: uv build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          uv run python -c "
            import zipfile
            import tarfile
            import sys

            # Verify wheel
            wheel = [f for f in __import__('glob').glob('dist/*.whl')][0]
            with zipfile.ZipFile(wheel, 'r') as z:
                files = z.namelist()
                print(f'Wheel: {wheel}')
                print(f'  Files: {len(files)}')
                assert any('penpath/cli/main.py' in f for f in files), 'Missing CLI entry point in wheel'
                assert any('penpath/__init__.py' in f for f in files), 'Missing package init in wheel'
                assert any('penpath/py.typed' in f for f in files), 'Missing py.typed marker in wheel'
                print('  ✓ Wheel verification passed')

            # Verify sdist
            sdist = [f for f in __import__('glob').glob('dist/*.tar.gz')][0]
            with tarfile.open(sdist, 'r:gz') as t:
                files = t.getnames()
                print(f'Sdist: {sdist}')
                print(f'  Files: {len(files)}')
                assert any('src/penpath/cli/main.py' in f for f in files), 'Missing CLI entry point in sdist'
                assert any('src/penpath/__init__.py' in f for f in files), 'Missing package init in sdist'
                assert any('pyproject.toml' in f for f in files), 'Missing pyproject.toml in sdist'
                print('  ✓ Sdist verification passed')
          "

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: true