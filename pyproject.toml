[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penpath"
version = "0.1.0"
description = "Photo to plottable SVG CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sergio Merino", email = "sergio.merino.a@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<14",
    "pillow>=10,<11",
    "numpy>=1.26,<2",
    "shapely>=2,<3",
    "svgwrite>=1.4,<2",
    "pyyaml>=6,<7",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "hatch",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[project.scripts]
penpath = "penpath.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "PTH", "SIM", "RUF"]
ignore = ["D"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["float-equality-comparison"]
"tests/**/*.py" = ["float-equality-comparison"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-xvs --strict-markers"