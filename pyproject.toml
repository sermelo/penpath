[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penpath"
version = "0.1.0"
description = "Photo to plottable SVG CLI"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Sergio Merino", email = "sergio.merino.a@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12,<1",
    "click>=8,<9",
    "rich>=13,<14",
    "pillow>=11,<12",
    "numpy>=2.4,<3",
    "shapely>=2,<3",
    "svgwrite>=1.4,<2",
    "pyyaml>=6,<7",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "tomli-w>=1,<2",
    "scikit-image>=0.24,<1",
]
[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "hatch",
]
test = [
    "vpype>=1.15",
]
vpype = [
    "vpype>=1.15",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[project.urls]
Homepage = "https://github.com/sermelo/penpath"
Repository = "https://github.com/sermelo/penpath"
Issues = "https://github.com/sermelo/penpath/issues"
Documentation = "https://github.com/sermelo/penpath/tree/main/docs"
Changelog = "https://github.com/sermelo/penpath/blob/main/CHANGELOG.md"

[project.scripts]
penpath = "penpath.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/penpath"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "PTH", "SIM", "RUF"]
ignore = ["D"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["float-equality-comparison"]
"tests/**/*.py" = ["float-equality-comparison"]
"src/penpath/core/__init__.py" = ["non-empty-init-module"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-vs --strict-markers -m 'not slow'"
markers = [
    "slow: full-render likeness, readability and plot-cost gates; run in nightly and on main",
]

[dependency-groups]
dev = [
    "types-shapely>=2.2.0.20261117",
    "types-PyYAML>=6.0.12",
]
