# Voxelab Aquila profile. Machine numbers and verbatim blocks come from sergio's
# reference script: sermelo/penpath, branch aquila-gcode-reference,
# reference/aquila_gcode/aquila_plot.py (constants and Plot.start/pen/end,
# proven on the real machine in test 4, 2026-11-18). Only the numbers live here;
# the reference's Python stays out of penpath. bed.margin_mm is penpath's own
# 10 mm safety margin; the reference script ran without one.
version: 1
name: aquila
description: Voxelab Aquila (Marlin) with the pen holder on the toolhead

bed:
  size_mm: [220.0, 220.0]
  pen_offset_mm: [-22.7, -28.6]
  nozzle_range_mm: [[0.0, 220.0], [0.0, 220.0]]
  margin_mm: 10.0
  page:
    placement: reachable_corner
  invert_y: true

feed:
  travel_mm_s: 100.0
  draw_mm_s: 25.0
  z_mm_s: 10.0

pen:
  z_up: 12.5
  z_down: 9.0
  z_touch: 10.0
  z_hover: 10.5
  ramp_mm: 1.5
  touch_xy_mm: [190.0, 12.0]

gcode:
  comment_prefix: ";"
  start: |
    ; BEFORE STARTING: paper held down, pen OUT of the clamp. Never home with a pen in.
    ; touch Z 10.0, pen down Z 9.0, up Z 12.5, offset (-22.7, -28.6)
    G21
    G90
    M104 S0
    M140 S0
    M107
    M84 S0 ; no stepper timeout during the pauses
    M201 X500 Y500 Z100
    M203 X500 Y500 Z10
    M204 P500 T500
    M205 X8.00 Y8.00 Z0.40
    M300 S1000 P300
    M117 Pen OUT? Homing in 10s
    G4 S10
    G28
    M420 S1 Z0 ; saved CR Touch mesh, no fade
    G1 Z{z_up} F{feed_z}
  end: |
    G1 Z80.000 F{feed_z}
    G1 X0.000 Y220.000 F{feed_travel} ; head left, bed forward: paper free to take out
    M300 S1500 P150
    G4 P200
    M300 S1500 P150
    M84 S120 ; stepper timeout back to the usual 120 s
    M84
    M117 Plot done
  layer_start: ""
  layer_end: ""

pen_change:
  mode: each
  steps:
    - {raw: "; ---- pen {pen_index}: {pen} ----"}
    - {z: up, feed: z}
    - {xy: touch, feed: travel}
    - {z: touch, feed: z}
    - {raw: "M300 S1000 P300"}
    - {message: "Pen {pen_index}: {pen}, touch, knob"}
    - {pause: "Pen {pen_index}: {pen}. Fit pen, touch paper, tighten clamp, press knob"}
    - {raw: "M300 S1500 P200"}
    - {message: "Plotting {pen}"}
    - {z: up, feed: z}
