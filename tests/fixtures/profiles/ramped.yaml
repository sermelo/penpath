# A test machine with a pen offset and a ramped landing (LUC-51 part 7).
ramped:
  version: 1
  name: ramped
  description: Test plotter with an offset pen and a ramped landing
  bed:
    size_mm: [210.0, 297.0]
    pen_offset_mm: [-2.0, -3.0]
    nozzle_range_mm: [[0.0, 210.0], [0.0, 297.0]]
    page:
      placement: fixed
      origin_mm: [0.0, 0.0]
    invert_y: true
  feed:
    travel_mm_s: 60.0
    draw_mm_s: 30.0
    z_mm_s: 10.0
  pen:
    z_up: 5.0
    z_down: 1.0
    z_touch: 2.0
    z_hover: 3.0
    ramp_mm: 2.0
  gcode:
    start: |
      G21
      G90
    end: |
      M2
